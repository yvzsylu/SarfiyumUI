<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Sarfiyum</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Play:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/x-icon" id="appIcon">
  
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAbvyBxmMbFhrzP9Z8moyYr6dCr-pzjhBE"></script>
  
  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.7s ease-in-out;
    }

    #splash-screen.remove {
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
  </style>

  <script>
    // Global değişken yapalım ki aşağıda kullanalım
    var currentBrandConfig = null;

    (function() {
      var brands = [
        { domain: 'cilcilaltin', folder: 'cilcilaltin', title: 'Çilçil Altın' },
        { domain: 'altinkosenadirkuyumculuk',    folder: 'altinkosenadirkuyumculuk',    title: 'Altınköşe Nadir Kuyumculuk' }
      ];

      // Varsayılan (Sarfiyum)
      var defaultConfig = {
        folder: 'sarfiyum',
        title: 'Sarfiyum'
      };

      var hostname = window.location.hostname;
      var found = false;

      for (var i = 0; i < brands.length; i++) {
        if (hostname.includes(brands[i].domain)) {
          currentBrandConfig = brands[i];
          found = true;
          break;
        }
      }

      if (!found) {
        currentBrandConfig = defaultConfig;
      }

      // Title ve Favicon'u hemen ayarla
      document.title = currentBrandConfig.title;
      
      // DOMContentLoaded beklemeden favicon'u bulmaya çalışalım (bazı tarayıcılar için)
      // Ancak head içinde olduğumuz için body elemanlarına erişemeyiz, link tagine erişebiliriz.
      var link = document.getElementById('appIcon'); 
      if(link) {
         link.href = '/assets/images/branding/' + currentBrandConfig.folder + '/favicon.ico';
      }

    })();
  </script>
</head>

<body>
  <app-root></app-root>
  
  <div id="splash-screen">
    <img id="splash-logo" alt="Logo" style="height: 60px; display: none;" />
  </div>

  <script>
    (function() {
      // Yukarıda hesaplanan config'i kullan
      if (currentBrandConfig) {
        var logoImg = document.getElementById('splash-logo');
        var favLink = document.getElementById('appIcon');
        
        var basePath = '/assets/images/branding/' + currentBrandConfig.folder + '/';

        // Favicon'u garantiye al (Head içindeki çalışmadıysa)
        if (favLink) favLink.href = basePath + 'favicon.ico';

        // Logoyu ayarla ve GÖSTER
        if (logoImg) {
          logoImg.src = basePath + 'logo-sm.png';
          logoImg.style.display = 'block'; // Artık görünür yapabiliriz
        }
      }
    })();
  </script>

  <script>
    window.addEventListener('load', function() {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
            setTimeout(function() {
                splashScreen.classList.add('remove');
            }, 1000); 
        }
    });
  </script>
  
  <noscript>You need to enable JavaScript to run this app.</noscript>
</body>

</html>
