<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Sarfiyum</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Play:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/x-icon" href="assets/branding/sarfiyum/favicon.ico" id="appIcon">
  
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAbvyBxmMbFhrzP9Z8moyYr6dCr-pzjhBE"></script>
  
  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.7s ease-in-out; /* Geçiş süresi düzeltildi */
    }

    #splash-screen.remove {
      opacity: 0;
      pointer-events: none; /* Tıklamayı engelle */
      z-index: -1;
    }
  </style>
</head>

<body>
  <app-root></app-root>
  
  <div id="splash-screen">
    <img id="splash-logo" alt="Logo" class="light" src="assets/branding/sarfiyum/logo-dark.png" style="height: 60px;" />
  </div>

  <script>
    // --- 1. WHITE LABEL ÖN YÜKLEME ---
    (function() {
       try {
         var hostname = window.location.hostname;
         var splashImg = document.getElementById('splash-logo');
         var favLink = document.getElementById('appIcon');

         // EĞER DOMAIN CİLCİL ALTIN İSE
         if (hostname.includes('cilcilaltin')) {
           // 1. Splash Logosu (DÜZELTME 2: logo-dark.png yapıldı)
           if (splashImg) splashImg.src = 'assets/branding/cilcilaltin/logo-dark.png';
           
           // 2. Favicon
           if (favLink) favLink.href = 'assets/branding/cilcilaltin/favicon.ico';
           
           // 3. Başlık
           document.title = 'Çilçil Altın';
         }
       } catch (e) { 
           console.error('Branding pre-loader error:', e); 
       }
    })();

    // --- 2. SPLASH SCREEN KALDIRMA ---
    // NOT: En ideali bunu AppComponent ngOnInit içinde yapmaktır.
    // Ancak orada yapmadıysan, buradaki kod Angular yüklenmesini bekler.
    window.addEventListener('load', function() {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
            // Biraz gecikme verelim ki Angular tam otursun (opsiyonel)
            setTimeout(function() {
                splashScreen.classList.add('remove');
            }, 1000); 
        }
    });
  </script>
  
  <noscript>You need to enable JavaScript to run this app.</noscript>
</body>

</html>
