<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Sarfiyum</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Play:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="/assets/images/branding/sarfiyum/favicon.ico" id="appIcon">

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAbvyBxmMbFhrzP9Z8moyYr6dCr-pzjhBE"></script>

  <style>
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.7s ease-in-out;
    }

    #splash-screen.remove {
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
  </style>

  <script>
    (function () {
      // --- AYARLAR ---
      // Buraya yeni müşteri geldikçe sadece domain ve klasör adını eklemen yeterli.
      // branding.service.ts'deki mantığın aynısıdır.
      var brands = [
        { domain: 'cilcilaltin', folder: 'cilcilaltin', title: 'Çilçil Altın' }
        // { domain: 'baskamusteri', folder: 'baskamusteri', title: 'Başka Müşteri' }
      ];

      // Varsayılan Ayarlar (Sarfiyum)
      var currentConfig = {
        folder: 'sarfiyum',
        title: 'Sarfiyum'
      };

      // Domain Kontrolü
      var hostname = window.location.hostname;
      for (var i = 0; i < brands.length; i++) {
        if (hostname.includes(brands[i].domain)) {
          currentConfig = brands[i];
          break;
        }
      }

      // --- DEĞİŞKENLERİ OLUŞTUR ---
      // Path yapısını burada birleştiriyoruz: assets/images/branding/[KLASÖR]/...
      var basePath = '/assets/images/branding/' + currentConfig.folder + '/';

      // 1. Tarayıcı Başlığını Değiştir
      document.title = currentConfig.title;

      // 2. Favicon'u Değiştir
      var favLink = document.getElementById('appIcon');
      if (favLink) {
        favLink.href = basePath + 'favicon.ico';
      }

      // 3. Splash Logoyu Değiştir (DOM Yüklendiğinde)
      // Bu script head içinde olduğu için body henüz oluşmadı,
      // bu yüzden DOMContentLoaded bekliyoruz.
      document.addEventListener("DOMContentLoaded", function () {
        var splashImg = document.getElementById('splash-logo');
        if (splashImg) {
          // İsteğine göre burayı 'logo-sm.png' veya 'logo-dark.png' yapabilirsin.
          // Genelde splash için büyük logo (dark) kullanılır.
          splashImg.src = basePath + 'logo-dark.png';

          // Hata olursa konsola bas
          splashImg.onerror = function () { console.error('Logo bulunamadı:', splashImg.src); };
        }
      });

    })();
  </script>
</head>

<body>
  <app-root></app-root>

  <div id="splash-screen">
    <img id="splash-logo" alt="Logo" src="/assets/images/branding/sarfiyum/logo-dark.png" style="height: 60px;" />
  </div>

  <script>
    // --- SPLASH SCREEN KALDIRMA ---
    window.addEventListener('load', function () {
      const splashScreen = document.getElementById('splash-screen');
      if (splashScreen) {
        setTimeout(function () {
          splashScreen.classList.add('remove');
        }, 1000);
      }
    });
  </script>

  <noscript>You need to enable JavaScript to run this app.</noscript>
</body>

</html>
