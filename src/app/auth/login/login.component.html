<div class="row justify-content-center h-100">
    <div class="col-lg-6 py-lg-5">
        <div class="d-flex flex-column h-100 justify-content-center">
            <app-logo-box className="auth-logo mb-4" />

            <div class="mb-5">
                <form [formGroup]="loginForm" (ngSubmit)="login()" class="authentication-form">
                    
                    <div class="mb-3">
                        <label class="form-label" for="username">Kullanıcı Adı</label>
                        <input 
                            formControlName="username" 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control" 
                            placeholder="Kullanıcı adınızı girin"
                            autocomplete="username"> 
                    </div>

                    <div class="mb-3">
                        <a routerLink="/auth/password" class="float-end text-muted text-unline-dashed ms-1">Parolamı Unuttum</a>
                        <label class="form-label" for="example-password">Şifre</label>
                        <input 
                            type="password" 
                            formControlName="password" 
                            id="example-password" 
                            class="form-control"
                            placeholder="Şifrenizi girin"
                            autocomplete="current-password">
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input 
                                type="checkbox" 
                                class="form-check-input" 
                                id="checkbox-login"
                                formControlName="rememberMe">
                            <label class="form-check-label" for="checkbox-login">Beni Hatırla</label>
                        </div>
                    </div>

                    <div class="mb-1 text-center d-grid">
                        <button class="btn btn-soft-primary" type="submit" [disabled]="isLoading">
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                            Giriş Yap
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
