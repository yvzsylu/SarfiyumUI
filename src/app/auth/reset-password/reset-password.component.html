<div class="row justify-content-center h-100">
    <div class="col-lg-6 py-lg-5">
        <div class="d-flex flex-column h-100 justify-content-center">
            <app-logo-box className="auth-logo mb-4" />

            <h2 class="fw-bold fs-24">Şifre Sıfırla</h2>

            <p class="text-muted mt-1 mb-4">
                E-posta adresinizi girin, size yeni şifrenizi içeren bir e-posta göndereceğiz.
            </p>

            <div>
                <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="authentication-form">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control" 
                               placeholder="E-posta adresinizi girin"
                               formControlName="email"
                               [ngClass]="{ 'is-invalid': submitted && f['email'].errors }">
                        
                        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                            <div *ngIf="f['email'].errors['required']">E-posta adresi zorunludur.</div>
                            <div *ngIf="f['email'].errors['email']">Geçerli bir e-posta adresi giriniz.</div>
                        </div>
                    </div>
                    
                    <div class="mb-1 text-center d-grid">
                        <button class="btn btn-primary" type="submit" [disabled]="isLoading">
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                            Şifreyi Sıfırla
                        </button>
                    </div>
                </form>
            </div>

            <p class="mt-5 text-danger text-center">
                Geri Dön <a routerLink="/auth/login" class="text-dark fw-bold ms-1">Giriş Yap</a>
            </p>
        </div>
    </div>
</div>
