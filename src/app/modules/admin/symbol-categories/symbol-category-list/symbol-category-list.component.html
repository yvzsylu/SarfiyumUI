<div class="card overflow-hidden">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="card-title mb-0">Sembol Kategori Listesi</h4>
    <a routerLink="/admin/symbol-categories/add" class="btn btn-primary btn-sm">
      <i class="bx bx-plus"></i> Yeni Kategori
    </a>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table align-middle mb-0 table-hover table-centered">
        <thead class="bg-light-subtle">
          <tr>
            <th>Kategori Adı</th>
            <th class="text-end">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="isLoading">
            <td colspan="2" class="text-center py-4">
              <div class="spinner-border text-primary" role="status"></div>
            </td>
          </tr>

          <tr *ngIf="!isLoading && categories.length === 0">
            <td colspan="2" class="text-center py-4">Kategori bulunamadı.</td>
          </tr>

          @for (item of categories; track $index) {
          <tr>
            <td>
              <span class="fw-bold text-dark">{{ item.name }}</span>
            </td>
            <td class="text-end">
              <div class="d-flex gap-2 justify-content-end">
                <a [routerLink]="['/admin/symbol-categories/edit', item.id]" class="btn btn-soft-primary btn-sm">
                  <iconify-icon icon="solar:pen-2-broken" class="align-middle fs-18"></iconify-icon>
                </a>
                <button (click)="deleteCategory(item.id)" class="btn btn-soft-danger btn-sm">
                  <iconify-icon icon="solar:trash-bin-minimalistic-2-broken" class="align-middle fs-18"></iconify-icon>
                </button>
              </div>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
