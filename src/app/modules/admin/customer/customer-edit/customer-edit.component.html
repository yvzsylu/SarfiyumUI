<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title">Müşteri Düzenle</h4>
            </div>
            <div class="card-body">
                <div *ngIf="isLoading && !editForm.value.name" class="text-center p-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Yükleniyor...</span>
                    </div>
                </div>

                <form *ngIf="!isLoading || editForm.value.name" [formGroup]="editForm" (ngSubmit)="onSubmit()">
                    
                    <h5 class="mb-3 text-primary"><i class="bx bx-building"></i> Firma Bilgileri</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Firma Adı</label>
                            <input type="text" class="form-control" formControlName="name" 
                                   [ngClass]="{'is-invalid': submitted && f['name'].errors}">
                            <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">Firma adı zorunludur.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Vergi Numarası (11 Hane)</label>
                            <input type="text" class="form-control" formControlName="taxNumber" 
                                   mask="00000000000" 
                                   [ngClass]="{'is-invalid': submitted && f['taxNumber'].errors}">
                            <div *ngIf="submitted && f['taxNumber'].errors" class="invalid-feedback">Geçerli bir vergi numarası giriniz.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefon</label>
                            <input type="text" class="form-control" formControlName="phoneNumber" 
                                   mask="(000) 000 00 00" prefix="+90 "
                                   [ngClass]="{'is-invalid': submitted && f['phoneNumber'].errors}">
                            <div *ngIf="submitted && f['phoneNumber'].errors" class="invalid-feedback">Telefon zorunludur.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Web Sitesi</label>
                            <input type="text" class="form-control" formControlName="website">
                        </div>
                    </div>

                    <h5 class="mb-3 text-primary mt-2"><i class="bx bx-map"></i> Adres Bilgileri</h5>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">İl</label>
                            <select class="form-select" formControlName="city" 
                                    [ngClass]="{'is-invalid': submitted && f['city'].errors}">
                                <option value="">Seçiniz...</option>
                                <option *ngFor="let city of cityList" [value]="city.name">{{ city.name }}</option>
                            </select>
                            <div *ngIf="submitted && f['city'].errors" class="invalid-feedback">İl zorunludur.</div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">İlçe</label>
                            <select class="form-select" formControlName="district" 
                                    [ngClass]="{'is-invalid': submitted && f['district'].errors}">
                                <option value="">Önce İl Seçiniz...</option>
                                <option *ngFor="let dist of districtList" [value]="dist">{{ dist }}</option>
                            </select>
                            <div *ngIf="submitted && f['district'].errors" class="invalid-feedback">İlçe zorunludur.</div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Posta Kodu</label>
                            <input type="text" class="form-control" formControlName="zipCode" 
                                   mask="00000">
                        </div>
                        
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Açık Adres</label>
                            <textarea class="form-control" formControlName="fullAddress" rows="3" 
                                      placeholder="Mahalle, Cadde, Sokak, Bina No vb."
                                      [ngClass]="{'is-invalid': submitted && f['fullAddress'].errors}"></textarea>
                            <div *ngIf="submitted && f['fullAddress'].errors" class="invalid-feedback">Adres girilmesi zorunludur.</div>
                        </div>
                    </div>

                    <input type="hidden" formControlName="isActive">

                    <div class="row mt-4">
                        <div class="col-12 text-end">
                            <a routerLink="/admin/customers/list" class="btn btn-secondary me-2">İptal</a>
                            <button type="submit" class="btn btn-primary" [disabled]="isLoading">
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
                                <i class="bx bx-save"></i> Güncelle
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
