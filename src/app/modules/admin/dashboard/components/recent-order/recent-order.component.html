<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
     <h4 class="card-title">Ödenmemiş Abonelikler / Bekleyen Ödemeler</h4>
     <a routerLink="/admin/subscriptions/list" class="btn btn-sm btn-soft-primary">Tümünü Gör</a>
  </div>
  
  <div class="table-responsive table-centered">
    <table class="table mb-0">
      <thead class="bg-light bg-opacity-50">
        <tr>
          <th class="ps-3">Firma</th>
          <th>Plan</th>
          <th>Tutar</th>
          <th>Oluşturulma Tarihi</th>
          <th>Durum</th>
          <th>İşlem</th>
        </tr>
      </thead>
      
      <tbody>
        <tr *ngFor="let item of unpaidList">
          <td class="ps-3 fw-semibold">{{ item.tenantName }}</td>
          <td>{{ item.planName }}</td>
          <td class="text-danger fw-bold">{{ item.amount | currency:'TRY':'symbol-narrow':'1.2-2' }}</td>
          <td>{{ item.dueDate | date:'dd.MM.yyyy' }}</td>
          <td>
             <span class="badge bg-soft-danger text-danger">Ödenmedi</span>
          </td>
          <td>
            <a [routerLink]="['/admin/subscriptions/list', {tenantId: item.tenantId}]" class="btn btn-sm btn-light">
                <i class="bx bx-show"></i> Detay
            </a>
          </td>
        </tr>
        <tr *ngIf="unpaidList.length === 0">
            <td colspan="6" class="text-center py-4 text-success">
                <i class="bx bx-check-circle fs-1"></i> <br>
                Harika! Bekleyen ödeme bulunmuyor.
            </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
