<div class="card">
  <div class="card-body">
    <h5 class="card-title mb-3">Plan Dağılımı</h5>
    <div class="apex-charts">
       <apx-chart 
        [series]="chartOptions.series!" 
        [chart]="chartOptions.chart!" 
        [labels]="chartOptions.labels!" 
        [colors]="chartOptions.colors!" 
        [legend]="chartOptions.legend!">
      </apx-chart>
    </div>
    <div class="text-center mt-4">
        <span class="badge bg-soft-primary text-primary me-2">Aylık: {{ monthly }}</span>
        <span class="badge bg-soft-warning text-warning">Yıllık: {{ yearly }}</span>
    </div>
  </div>
</div>
