<div class="card card-height-100">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h4 class="card-title">Süresi Yaklaşanlar</h4>
  </div>
  <div class="table-responsive">
    <table class="table table-hover table-nowrap table-centered m-0">
      <thead class="bg-light bg-opacity-50">
        <tr>
          <th class="ps-3">Firma</th>
          <th>Bitiş Tarihi</th>
          <th>Kalan Gün</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of tenants">
          <td class="ps-3 fw-bold">{{ item.tenantName }}</td>
          <td>{{ item.endDate | date:'dd.MM.yyyy' }}</td>
          <td>
            <span class="badge" 
                  [ngClass]="item.remainingDays < 5 ? 'bg-danger' : 'bg-warning'">
               {{ item.remainingDays }} Gün
            </span>
          </td>
        </tr>
        <tr *ngIf="tenants.length === 0">
            <td colspan="3" class="text-center text-muted">Yakın zamanda süresi dolacak firma yok.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
