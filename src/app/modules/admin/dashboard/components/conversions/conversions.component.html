<div class="card">
  <div class="card-body">
    <h5 class="card-title mb-3">Abonelik Durumları</h5>
    <div id="conversions" class="apex-charts">
      <apx-chart 
        [series]="chartOptions.series!" 
        [chart]="chartOptions.chart!" 
        [labels]="chartOptions.labels!" 
        [colors]="chartOptions.colors!" 
        [legend]="chartOptions.legend!" 
        [dataLabels]="chartOptions.dataLabels!">
      </apx-chart>
    </div>
    <div class="row text-center mt-3">
      <div class="col-6">
        <p class="text-muted mb-1">Aktif</p>
        <h4 class="text-success">{{ active }}</h4>
      </div> 
      <div class="col-6">
        <p class="text-muted mb-1">Expired</p>
        <h4 class="text-danger">{{ expired }}</h4>
      </div> 
    </div> 
  </div>
</div>
