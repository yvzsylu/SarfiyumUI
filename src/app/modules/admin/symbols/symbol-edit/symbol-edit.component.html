<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title">Sembol Düzenle</h4>
      </div>
      <div class="card-body">

        <div *ngIf="isLoading && !editForm.touched" class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2 text-muted small">Sembol bilgileri yükleniyor...</p>
        </div>

        <form *ngIf="!isLoading || editForm.touched" [formGroup]="editForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label">Sembol Adı</label>
            <input type="text" class="form-control" formControlName="name" 
                   [ngClass]="{'is-invalid': submitted && editForm.controls['name'].errors}">
            <div *ngIf="submitted && editForm.controls['name'].errors" class="invalid-feedback">
              Sembol adı zorunludur.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Kategori</label>
            <select class="form-select" formControlName="categoryId"
                    [ngClass]="{'is-invalid': submitted && editForm.controls['categoryId'].errors}">
              <option value="">Seçiniz...</option>
              <option *ngFor="let cat of categoryList" [value]="cat.id">
                {{ cat.name }}
              </option>
            </select>
            <div *ngIf="submitted && editForm.controls['categoryId'].errors" class="invalid-feedback">
              Kategori seçimi zorunludur.
            </div>
          </div>

          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" role="switch" 
                   id="activeSwitch" formControlName="isActive">
            <label class="form-check-label" for="activeSwitch">
              Sembol Aktif
            </label>
          </div>

          <div class="text-end">
            <a routerLink="/admin/symbols/list" class="btn btn-secondary me-2">İptal</a>
            
            <button type="submit" class="btn btn-primary" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
              <i *ngIf="!isLoading" class="bx bx-save me-1"></i>
              Değişiklikleri Kaydet
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
