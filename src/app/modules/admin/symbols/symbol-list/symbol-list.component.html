<div class="card overflow-hidden">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h4 class="card-title mb-0">Sembol Listesi</h4>
    <a routerLink="/admin/symbols/add" class="btn btn-primary btn-sm">
      <i class="bx bx-plus"></i> Yeni Sembol
    </a>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table align-middle mb-0 table-hover table-centered">
        <thead class="bg-light-subtle">
          <tr>
            <th>Sembol Adı</th>
            <th>Kategori</th>
            <th>Durum</th>
            <th class="text-end">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="isLoading">
            <td colspan="4" class="text-center py-4">
              <div class="spinner-border text-primary" role="status"></div>
            </td>
          </tr>

          <tr *ngIf="!isLoading && symbols.length === 0">
            <td colspan="4" class="text-center py-4">Hiç sembol bulunamadı.</td>
          </tr>

          @for (item of symbols; track $index) {
          <tr>
            <td>
              <span class="fw-bold text-primary">{{ item.name }}</span>
            </td>
            <td>
              <span class="badge bg-secondary-subtle text-secondary">{{ item.categoryName }}</span>
            </td>
            <td>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" 
                       [id]="'switch_' + item.id"
                       [checked]="item.isActive"
                       (change)="onStatusChange(item, $event)">
                <label class="form-check-label" [for]="'switch_' + item.id">
                  <span *ngIf="item.isActive" class="text-success small">Aktif</span>
                  <span *ngIf="!item.isActive" class="text-danger small">Pasif</span>
                </label>
              </div>
            </td>
            <td class="text-end">
              <div class="d-flex gap-2 justify-content-end">
                <a [routerLink]="['/admin/symbols/edit', item.id]" class="btn btn-soft-primary btn-sm">
                  <iconify-icon icon="solar:pen-2-broken" class="align-middle fs-18"></iconify-icon>
                </a>
                <button (click)="deleteSymbol(item.id)" class="btn btn-soft-danger btn-sm">
                  <iconify-icon icon="solar:trash-bin-minimalistic-2-broken" class="align-middle fs-18"></iconify-icon>
                </button>
              </div>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
