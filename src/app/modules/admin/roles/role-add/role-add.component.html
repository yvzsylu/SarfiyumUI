<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title">Yeni Rol Oluştur</h4>
            </div>
            <div class="card-body">
                
                <form [formGroup]="roleForm" (ngSubmit)="onSubmit()">
                    <div class="row">
                        <div class="col-lg-6">
                            <div class="mb-3">
                                <label for="role-name" class="form-label">Rol Adı</label>
                                <input type="text" id="role-name" class="form-control" 
                                       placeholder="Örn: Manager" formControlName="name"
                                       [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
                                
                                <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
                                    <div *ngIf="f['name'].errors['required']">Rol adı zorunludur.</div>
                                    <div *ngIf="f['name'].errors['minlength']">Rol adı en az 2 karakter olmalıdır.</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary" [disabled]="isLoading">
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
                                Kaydet
                            </button>
                            <a routerLink="/admin/roles/list" class="btn btn-secondary ms-2">İptal</a>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
