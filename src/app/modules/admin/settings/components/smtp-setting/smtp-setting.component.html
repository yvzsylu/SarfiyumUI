<div class="card">
    <div class="card-header">
        <h4 class="card-title d-flex align-items-center gap-1">
            <iconify-icon icon="solar:settings-bold-duotone" class="text-primary fs-20"></iconify-icon>
            SMTP Mail Ayarları
        </h4>
    </div>
    <div class="card-body">
        
        <!-- Loading Spinner -->
        <div *ngIf="isLoading && !smtpForm.touched" class="text-center py-4">
             <div class="spinner-border text-primary" role="status"></div>
        </div>

        <form [formGroup]="smtpForm" *ngIf="!isLoading || smtpForm.touched">
            <div class="row">
                <!-- Host -->
                <div class="col-lg-6 mb-3">
                    <label class="form-label">SMTP Host</label>
                    <input type="text" class="form-control" formControlName="host" placeholder="örn: smtp.gmail.com"
                           [ngClass]="{'is-invalid': smtpForm.get('host')?.invalid && smtpForm.get('host')?.touched}">
                </div>

                <!-- Port -->
                <div class="col-lg-6 mb-3">
                    <label class="form-label">Port</label>
                    <input type="number" class="form-control" formControlName="port" placeholder="örn: 587"
                           [ngClass]="{'is-invalid': smtpForm.get('port')?.invalid && smtpForm.get('port')?.touched}">
                </div>

                <!-- Email -->
                <div class="col-lg-6 mb-3">
                    <label class="form-label">E-Posta Adresi</label>
                    <input type="email" class="form-control" formControlName="email" placeholder="mail@domain.com"
                           [ngClass]="{'is-invalid': smtpForm.get('email')?.invalid && smtpForm.get('email')?.touched}">
                </div>

                <!-- Şifre -->
                <div class="col-lg-6 mb-3">
                    <label class="form-label">Şifre (Uygulama Şifresi)</label>
                    <input type="password" class="form-control" formControlName="password" placeholder="******"
                           [ngClass]="{'is-invalid': smtpForm.get('password')?.invalid && smtpForm.get('password')?.touched}">
                </div>

                <!-- Görünür İsim -->
                <div class="col-lg-6 mb-3">
                    <label class="form-label">Gönderici Adı (Display Name)</label>
                    <input type="text" class="form-control" formControlName="displayName" placeholder="Sarfiyum Bilgilendirme">
                </div>

                <!-- SSL Switch -->
                <div class="col-lg-6 mb-3 d-flex align-items-center">
                    <div class="form-check form-switch mt-4">
                        <input class="form-check-input" type="checkbox" role="switch" id="sslSwitch" formControlName="enableSsl">
                        <label class="form-check-label" for="sslSwitch">SSL Kullan (Güvenli Bağlantı)</label>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
