<div class="modal-header">
  <h5 class="modal-title">Rol Atama — {{ user.fullName }}</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">

  <div class="mb-3">
    <label class="form-label">Sistem Rolleri</label>

    <div class="d-flex flex-wrap gap-2">
      @for(role of roles(); track role.id) {
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-primary]="selectedRoles().includes(role.name)"
          [class.btn-outline-secondary]="!selectedRoles().includes(role.name)"
          (click)="toggleRole(role.name)">
          {{ role.name }}
        </button>
      }
    </div>
  </div>

</div>

<div class="modal-footer">
  <button class="btn btn-light" (click)="close()">Kapat</button>
  <button class="btn btn-primary" (click)="assign()">Kaydet</button>
</div>
