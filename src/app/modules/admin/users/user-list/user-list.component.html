<div class="card overflow-hidden">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table align-middle mb-0 table-hover table-centered">
        <thead class="bg-light-subtle">
          <tr>
            <th>Kullanıcı Adı</th>
            <th>Ad Soyad</th>
            <th>Email</th>
            <th>Kurum</th>
            <th>Durum</th>
            <th class="text-end">İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="isLoading">
            <td colspan="2" class="text-center py-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Yükleniyor...</span>
              </div>
            </td>
          </tr>

          <tr *ngIf="!isLoading && users.length === 0">
            <td colspan="2" class="text-center py-4">Hiç kullanıcı bulunamadı.</td>
          </tr>

          @for (item of users; track $index) {
          <tr>
            <td>
              <span class="fw-semibold">{{ item.username }}</span>
            </td>
            <td>
              <span class="fw-semibold">{{ item.fullName }}</span>
            </td>
            <td>
              <span class="fw-semibold">{{ item.email }}</span>
            </td>
            
            <td>
              <span class="fw-semibold">{{ item.tenantName }}</span>
            </td>
            <td>
                    <div class="form-check form-switch">
                        <input class="form-check-input" 
                               type="checkbox" 
                               role="switch" 
                               [id]="'switch_' + item.id"
                               [checked]="item.isActive"
                               (change)="onStatusChange(item, $event)">
                        <label class="form-check-label" [for]="'switch_' + item.id">
                            <span *ngIf="item.isActive" class="badge bg-success-subtle text-success">Aktif</span>
                            <span *ngIf="!item.isActive" class="badge bg-danger-subtle text-danger">Pasif</span>
                        </label>
                    </div>
                </td>
            <td class="text-end">
              <div class="d-flex gap-2 justify-content-end">
                
                <a [routerLink]="['/admin/users/edit', item.id]" class="btn btn-soft-primary btn-sm">
                  <iconify-icon icon="solar:pen-2-broken" class="align-middle fs-18"></iconify-icon>
                </a>
                
                <a href="javascript:void(0);" (click)="deleteUser(item.id)" class="btn btn-soft-danger btn-sm">
                  <iconify-icon icon="solar:trash-bin-minimalistic-2-broken" class="align-middle fs-18"></iconify-icon>
                </a>
              </div>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>

  <div class="row g-0 align-items-center justify-content-between text-center text-sm-start p-3 border-top">
    <div class="col-sm">
      <div class="text-muted">
        Toplam <span class="fw-semibold">{{ users.length }}</span> sonuç gösteriliyor.
      </div>
    </div>
  </div>
</div>
