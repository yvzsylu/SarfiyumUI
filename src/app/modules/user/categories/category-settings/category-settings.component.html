<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title">Kategori Ayarları</h4>
                <p class="text-muted mb-0">Ürünlerinizin listelendiği kategori isimlerini buradan düzenleyebilirsiniz.</p>
            </div>
            
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-centered mb-0 align-middle">
                        <thead class="bg-light-subtle">
                            <tr>
                                <th style="width: 80px;">Sıra</th>
                                <th>Kategori Adı</th>
                                <th class="text-end" style="width: 150px;">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngIf="isLoading && categories.length === 0">
                                <td colspan="3" class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Yükleniyor...</span>
                                    </div>
                                </td>
                            </tr>

                            <tr *ngFor="let item of categories">
                                <td>
                                    <span class="badge bg-light text-dark border">{{ item.orderIndex }}</span>
                                </td>

                                <td>
                                    <div *ngIf="editingId !== item.id">
                                        <span class="fw-semibold text-dark">{{ item.name }}</span>
                                    </div>

                                    <div *ngIf="editingId === item.id">
                                        <input type="text" 
                                               class="form-control form-control-sm" 
                                               [(ngModel)]="editNameValue"
                                               (keydown.enter)="saveEdit(item)"
                                               (keydown.escape)="cancelEdit()"
                                               autofocus
                                               placeholder="Kategori adı giriniz...">
                                    </div>
                                </td>

                                <td class="text-end">
                                    <div *ngIf="editingId !== item.id">
                                        <button (click)="startEdit(item)" 
                                                class="btn btn-soft-primary btn-sm" 
                                                [disabled]="isLoading">
                                            <iconify-icon icon="solar:pen-2-broken" class="align-middle fs-18"></iconify-icon> Düzenle
                                        </button>
                                    </div>

                                    <div *ngIf="editingId === item.id" class="d-flex justify-content-end gap-1">
                                        <button (click)="saveEdit(item)" 
                                                class="btn btn-soft-success btn-sm"
                                                [disabled]="isLoading">
                                            <iconify-icon icon="solar:check-circle-broken" class="align-middle fs-18"></iconify-icon>
                                        </button>
                                        <button (click)="cancelEdit()" 
                                                class="btn btn-soft-danger btn-sm"
                                                [disabled]="isLoading">
                                            <iconify-icon icon="solar:close-circle-broken" class="align-middle fs-18"></iconify-icon>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
