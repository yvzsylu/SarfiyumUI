<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="card-title">Kullanıcı Hesapları</h4>
                <a routerLink="/user/viewers/add" class="btn btn-primary btn-sm">
                    <i class="bx bx-plus"></i> Yeni Kullanıcı Ekle
                </a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-centered mb-0 align-middle">
                        <thead class="bg-light-subtle">
                            <tr>
                                <th>Ad Soyad</th>
                                <th>Kullanıcı Adı</th>
                                <th>E-Posta</th>
                                <th>Durum</th>
                                <th class="text-end">İşlemler</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngIf="isLoading">
                                <td colspan="5" class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Yükleniyor...</span>
                                    </div>
                                </td>
                            </tr>

                            <tr *ngIf="!isLoading && viewers.length === 0">
                                <td colspan="5" class="text-center py-4 text-muted">
                                    Henüz eklenmiş bir izleyici hesabı bulunmuyor.
                                </td>
                            </tr>

                            <tr *ngFor="let item of viewers">
                                <td>
                                    <span class="fw-semibold">{{ item.fullName }}</span>
                                </td>
                                <td>{{ item.username }}</td>
                                <td>{{ item.email }}</td>
                                <td>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" role="switch"
                                               [id]="'switch_' + item.id"
                                               [checked]="item.isActive" 
                                               (change)="onStatusChange(item, $event)">
                                        <label class="form-check-label" [for]="'switch_' + item.id">
                                            <span *ngIf="item.isActive" class="badge bg-success-subtle text-success">Aktif</span>
                                            <span *ngIf="!item.isActive" class="badge bg-danger-subtle text-danger">Pasif</span>
                                        </label>
                                    </div>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex gap-2 justify-content-end">
                                        
                                        <button (click)="openPricingModal(item)" class="btn btn-soft-success btn-sm" title="Özel Fiyatlar">
                                            <i class="bx bx-dollar-circle fs-5 align-middle"></i>
                                        </button>

                                        <a [routerLink]="['/user/viewers/edit', item.id]" class="btn btn-soft-primary btn-sm" title="Düzenle">
                                            <iconify-icon icon="solar:pen-2-broken" class="align-middle fs-18"></iconify-icon>
                                        </a>

                                        <button (click)="deleteViewer(item.id)" class="btn btn-soft-danger btn-sm" title="Sil">
                                            <iconify-icon icon="solar:trash-bin-minimalistic-2-broken" class="align-middle fs-18"></iconify-icon>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
