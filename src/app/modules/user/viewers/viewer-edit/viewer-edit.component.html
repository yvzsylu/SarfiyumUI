<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title">Kullanıcı Düzenle</h4>
            </div>
            <div class="card-body">
                
                <div *ngIf="isLoading && !editForm.touched" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Kullanıcı bilgileri yükleniyor...</p>
                </div>

                <form *ngIf="!isLoading || editForm.touched" [formGroup]="editForm" (ngSubmit)="onSubmit()">
                    
                    <div class="d-flex justify-content-end mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="activeSwitch" formControlName="isActive">
                            <label class="form-check-label" for="activeSwitch">Hesap Aktif</label>
                        </div>
                    </div>

                    <h5 class="mb-3 text-primary"><i class="bx bx-user-circle"></i> Kullanıcı Bilgileri</h5>

                    <div class="mb-3">
                        <label class="form-label">Ad Soyad</label>
                        <input type="text" class="form-control" formControlName="fullName"
                               [ngClass]="{'is-invalid': submitted && f['fullName'].errors}">
                        <div *ngIf="submitted && f['fullName'].errors" class="invalid-feedback">Gerekli alan.</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Kullanıcı Adı</label>
                            <input type="text" class="form-control" formControlName="username"
                                   [ngClass]="{'is-invalid': submitted && f['username'].errors}">
                            <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">Gerekli alan.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">E-Posta</label>
                            <input type="email" class="form-control" formControlName="email"
                                   [ngClass]="{'is-invalid': submitted && f['email'].errors}">
                            <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">Geçerli e-posta giriniz.</div>
                        </div>
                    </div>

                    <h5 class="mb-3 text-primary mt-4"><i class="bx bx-lock-alt"></i> Şifre Değişikliği</h5>
                    <div class="alert alert-info py-2">
                        <i class="bx bx-info-circle me-1"></i> Şifreyi değiştirmek istemiyorsanız boş bırakın.
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Yeni Şifre</label>
                            <input type="password" class="form-control" formControlName="password" placeholder="***">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Şifre Tekrar</label>
                            <input type="password" class="form-control" formControlName="confirmPassword" placeholder="***"
                                   [ngClass]="{'is-invalid': editForm.errors?.['mismatch']}">
                            <div *ngIf="editForm.errors?.['mismatch']" class="invalid-feedback">
                                Şifreler uyuşmuyor.
                            </div>
                        </div>
                    </div>

                    <div class="text-end mt-3">
                        <a routerLink="/user/viewers" class="btn btn-secondary me-2">İptal</a>
                        <button type="submit" class="btn btn-success" [disabled]="isLoading">
                            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
                            <i class="bx bx-save"></i> Değişiklikleri Kaydet
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
