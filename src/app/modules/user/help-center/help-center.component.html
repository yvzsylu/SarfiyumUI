<div class="row justify-content-center">
  <div class="col-lg-12">
    <div class="card overflow-hidden" style="background: url('assets/images/small/img-2.jpg'); background-size: cover; background-position: center;">
      <div class="position-absolute top-0 end-0 bottom-0 start-0 bg-dark opacity-75"></div>
      <div class="card-body py-5">
        <div class="row justify-content-center">
          <div class="col-lg-7 text-center">
            <h3 class="text-white">Yardım Merkezi</h3>
            <p class="text-white-50">Sarfiyum ile ilgili size nasıl yardımcı olabiliriz?</p>

            <div class="search-bar mb-4">
              <span><i class="bx bx-search-alt"></i></span>
              <input type="search" class="form-control rounded-pill bg-white border-0" id="search" placeholder="Sorunuzu arayın (Örn: Stok ekleme)...">
            </div>

            <div class="d-inline-block bg-success bg-opacity-75 rounded-pill px-4 py-2 mt-2">
              <a href="https://wa.me/905399212391" target="_blank" class="text-white text-decoration-none d-flex align-items-center gap-2">
                 <i class="bx bxl-whatsapp fs-4"></i>
                 <span>Sorun mu yaşıyorsunuz? <strong>+90 539 921 23 91</strong> WhatsApp hattımızdan bize ulaşın.</span>
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row">
  @for(item of helpList;track $index){
  <div class="col-lg-4">
    <div class="card h-100">
      <div class="card-body text-center">
        <div class="avatar bg-primary-subtle d-flex align-items-center justify-content-center rounded-circle mx-auto mb-3" style="width:60px; height:60px;">
          <iconify-icon [icon]="item.icon" class="fs-32 text-primary"></iconify-icon>
        </div>
        <h4 class="mt-3 fs-18">{{item.title}}</h4>
        <p class="text-muted mb-0">{{item.description}}</p>
      </div>
    </div>
  </div>
  }
</div>
