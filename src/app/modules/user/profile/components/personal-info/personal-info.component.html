<div class="card" *ngIf="user">
  <div class="card-header">
       <h4 class="card-title">Kişisel Bilgiler</h4>
  </div>
  <div class="card-body">
       <div>
           <div class="d-flex align-items-center gap-2 mb-3">
                <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
                     <iconify-icon icon="solar:shield-user-bold-duotone" class="fs-20 text-secondary"></iconify-icon>
                </div>
                <p class="mb-0 fs-14">Rol: <span class="text-dark fw-semibold">{{ user.roles.join(', ') }}</span></p>
           </div>

           <div class="d-flex align-items-center gap-2 mb-3">
                <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
                     <iconify-icon icon="solar:letter-bold-duotone" class="fs-20 text-secondary"></iconify-icon>
                </div>
                <p class="mb-0 fs-14">Email: <a href="mailto:{{user.email}}" class="text-primary fw-semibold">{{user.email}}</a></p>
           </div>

           <div class="d-flex align-items-center gap-2 mb-3" *ngIf="user.phoneNumber">
                <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
                     <iconify-icon icon="solar:phone-bold-duotone" class="fs-20 text-secondary"></iconify-icon>
                </div>
                <p class="mb-0 fs-14">Tel: <span class="text-dark fw-semibold">{{user.phoneNumber}}</span></p>
           </div>

           <hr class="my-3">
           
           <div *ngIf="user.tenantId">
               <h5 class="card-title mb-3">Firma Bilgileri</h5>
               
               <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
                         <iconify-icon icon="solar:shop-bold-duotone" class="fs-20 text-secondary"></iconify-icon>
                    </div>
                    <p class="mb-0 fs-14">{{ user.tenantName }}</p>
               </div>

               <div class="d-flex align-items-center gap-2 mb-3" *ngIf="user.tenantCity">
                    <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
                         <iconify-icon icon="solar:map-point-bold-duotone" class="fs-20 text-secondary"></iconify-icon>
                    </div>
                    <p class="mb-0 fs-14">{{ user.tenantDistrict }} / {{ user.tenantCity }}</p>
               </div>

               <div class="d-flex align-items-center gap-2 mb-3" *ngIf="user.tenantWebsite">
                    <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
                         <iconify-icon icon="solar:link-bold-duotone" class="fs-20 text-secondary"></iconify-icon>
                    </div>
                    <p class="mb-0 fs-14"><a [href]="user.tenantWebsite" target="_blank" class="text-primary fw-semibold">Web Sitesi</a></p>
               </div>
               
               <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="avatar-sm bg-light d-flex align-items-center justify-content-center rounded">
                         <iconify-icon icon="solar:file-text-bold-duotone" class="fs-20 text-secondary"></iconify-icon>
                    </div>
                    <p class="mb-0 fs-14">Vergi No: <span class="text-dark fw-semibold">{{ user.tenantTaxNumber }}</span></p>
               </div>
           </div>

       </div>
 </div>
</div>
