name: Trigger Production Build

on:
  push:
    branches: [ "master", "main" ]

jobs:
  notify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Send Trigger to API Repo
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/roulda/SarfiyumAPI/actions/workflows/deploy.yml/dispatches \
          -d '{"ref":"master"}'